<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ed557b"><title>Admin — Đậu Đậu Affiliate</title><link rel="stylesheet" href="admin.css"></head><body><main class="wrap"><section id="login" class="panel"><div class="logo">🔐</div><h1>Quản trị sản phẩm</h1><p>Đăng nhập để quản lý danh sách sản phẩm affiliate.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Mật khẩu<input id="password" type="password" autocomplete="current-password" required></label><button>Đăng nhập</button><div id="loginMsg" class="msg"></div></form></section><section id="app" class="hidden"><header class="top"><div><h1>📦 Quản lý sản phẩm</h1><p>Đậu Đậu Family Affiliate</p></div><button id="logout" class="ghost">Đăng xuất</button></header><section class="panel"><div class="form-head"><h2 id="formTitle">Thêm sản phẩm</h2><button id="cancelEdit" type="button" class="ghost hidden">Hủy sửa</button></div><form id="productForm"><input id="productId" type="hidden"><div class="row"><label>Tên sản phẩm<input id="name" required maxlength="120"></label><label>Danh mục<input id="category" list="categoryList" placeholder="Ví dụ: Thời trang bé" required maxlength="60"><datalist id="categoryList"></datalist></label></div><label>Link affiliate<input id="link" type="url" placeholder="https://..." required></label><label>Ảnh sản phẩm<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><small>Chọn ảnh từ điện thoại. Tối đa 5MB.</small><div id="imagePreview" class="preview"></div><input id="image" type="hidden"></label><label>Mô tả ngắn<textarea id="description" rows="3" maxlength="180"></textarea></label><div class="row"><label>Giá hiển thị<input id="price" inputmode="numeric" placeholder="210000 hoặc 210.000đ"></label><label>Thứ tự<input id="sortOrder" type="number" value="0"></label></div><label class="check"><input id="pinned" type="checkbox"> 📌 Ghim sản phẩm lên đầu</label><label class="check"><input id="active" type="checkbox" checked> Hiển thị sản phẩm</label><button id="saveBtn">💾 Lưu sản phẩm</button><div id="formMsg" class="msg"></div></form></section><section class="panel"><div class="list-head"><div><h2>Sản phẩm hiện có</h2><p>Kéo sản phẩm để đổi thứ tự.</p></div><button id="refresh" type="button" class="ghost">↻ Làm mới</button></div><div id="productList" class="products"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="admin.js"></script></body></html>
