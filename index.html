<!doctype html>
<html lang="vi">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#f15b7f"><meta name="description" content="Sản phẩm được Đậu Đậu Family chọn lọc và giới thiệu."><title>Đậu Đậu Family — Sản phẩm mình đề xuất</title><link rel="stylesheet" href="style.css"></head>
<body><div class="page-shell"><header class="hero"><img class="hero-image" src="header.png" alt="Đậu Đậu Family"></header><section class="title-band"><div class="eyebrow">🎁 GỢI Ý CHO MẸ & BÉ</div><h2>Sản phẩm mình đề xuất</h2><p>Những món đồ hữu ích mình muốn chia sẻ cùng bạn.</p></section><nav class="filters" id="filters" aria-label="Danh mục sản phẩm"></nav><main><section class="product-grid" id="products" aria-live="polite"></section></main><footer><strong>💗 Cảm ơn bạn đã ủng hộ Đậu Đậu Family!</strong><p>Mỗi lượt ghé xem sản phẩm qua link của mình là một động lực để mình chia sẻ thêm nhiều điều hữu ích.</p></footer></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script>
const state={products:[],category:'Tất cả'};const configured=window.SUPABASE_URL&&window.SUPABASE_ANON_KEY&&!window.SUPABASE_URL.includes('YOUR_')&&!window.SUPABASE_ANON_KEY.includes('YOUR_');const client=configured?window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY):null;const $=s=>document.querySelector(s);function escapeHtml(value=''){return String(value).replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}function formatPrice(v=''){const n=String(v).replace(/[^0-9]/g,'');return n?Number(n).toLocaleString('vi-VN')+'đ':''}
async function loadProducts(){if(!client){$('#products').innerHTML='<div class="empty">Website đang được cấu hình. Vui lòng quay lại sau.</div>';return}const {data,error}=await client.from('products').select('*').eq('active',true).order('pinned',{ascending:false}).order('sort_order',{ascending:true}).order('created_at',{ascending:false});if(error){console.error(error);$('#products').innerHTML='<div class="empty">Không thể tải sản phẩm lúc này.</div>';return}state.products=data||[];renderFilters();renderProducts()}
function renderFilters(){const categories=['Tất cả',...new Set(state.products.map(p=>p.category).filter(Boolean))];if(!categories.includes(state.category))state.category='Tất cả';$('#filters').innerHTML=categories.map(c=>`<button class="filter ${c===state.category?'active':''}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`).join('');$('#filters').querySelectorAll('.filter').forEach(b=>b.addEventListener('click',()=>{state.category=b.dataset.category;renderFilters();renderProducts()}))}
function renderProducts(){const list=state.category==='Tất cả'?state.products:state.products.filter(p=>p.category===state.category);if(!list.length){$('#products').innerHTML='<div class="empty">Chưa có sản phẩm.</div>';return}$('#products').innerHTML=list.map(p=>{const imageUrl=String(p.image_url||p.video_thumbnail_url||'').trim();const image=imageUrl?`<img src="${escapeHtml(imageUrl)}" alt="${escapeHtml(p.name)}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:'<div class="image-placeholder">🛍️</div>';const fallback=`<div class="image-placeholder" style="display:${imageUrl?'none':'flex'}">🛍️</div>`;const video=p.video_url?`<a class="video-button" href="${escapeHtml(p.video_url)}" target="_blank" rel="noopener noreferrer"><span>▶ XEM VIDEO TIKTOK</span></a>`:'';return `<article class="product-card">${p.pinned?'<div class="pin-badge">📌 ĐỀ XUẤT</div>':''}<div class="product-image">${image}${fallback}</div><div class="product-body"><div class="category-label">${escapeHtml(p.category||'Mẹ & Bé')}</div><h3>${escapeHtml(p.name)}</h3>${p.description?`<p class="description">${escapeHtml(p.description)}</p>`:''}${p.price?`<div class="price">${escapeHtml(formatPrice(p.price))}</div>`:''}<div class="product-actions">${video}<a class="product-button" href="${escapeHtml(p.affiliate_url)}" target="_blank" rel="noopener noreferrer sponsored">XEM SẢN PHẨM <span>↗</span></a></div></div></article>`}).join('')}
loadProducts();</script></body></html>
